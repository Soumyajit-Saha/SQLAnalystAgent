[project]
name = "dataagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Soumyajit Saha", email = "u1320949@umail.utah.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.143.0",
    "ipython>=9.17.1",
    "langchain>=1.4.4",
    "langchain-anthropic>=1.7.5",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-redis>=0.5.2",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
dataagent = "dataagent:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
